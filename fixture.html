<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixture · Dinastia</title>
<meta name="description" content="Fixture y resultados de rugby del Litoral, por Dinastia · Capturando la pasión del deporte">
<meta name="theme-color" content="#060635">
<meta property="og:title" content="Fixture · Dinastia">
<meta property="og:description" content="Fixture y resultados, fecha por fecha.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,125,700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#060635;--secondary:#04015D;--gray:#9E9E9E;--t2:#515172;--tint:#eaeaee;--tint2:#e6e6ef;--line:#d0d0db;--gradient:linear-gradient(90deg,#060635 50%,#04015D 50%);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow Condensed',sans-serif;font-weight:500;background:#ffffff;color:var(--primary);font-size:17px;-webkit-font-smoothing:antialiased}
.disp{font-family:'Saira',sans-serif;font-stretch:125%;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
header{background:var(--gradient);color:#fff;padding:18px 16px 22px}
.hin{max-width:900px;margin:0 auto}
.logo{height:34px;width:auto;display:block}
.tag{font-size:14px;opacity:.85;margin-top:6px;letter-spacing:.02em}
h1{font-size:34px;margin-top:18px;line-height:1}
.sub{opacity:.85;margin-top:6px;font-size:16px}
main{max-width:900px;margin:0 auto;padding:16px 16px 40px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{border:1px solid #b4b4c2;background:#fff;color:var(--primary);border-radius:9999px;padding:8px 16px;font:inherit;font-size:16px;cursor:pointer;min-height:40px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.yr{font-family:'Saira',sans-serif;font-stretch:125%;font-style:italic;font-weight:700}
select{font:inherit;font-size:16px;border:1px solid #82829a;padding:9px 12px;background:#fff;color:var(--primary);min-height:42px;max-width:100%}
.lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);margin-right:4px}
.prox{background:var(--secondary);color:#fff;padding:16px;margin:16px 0}
.prox .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.prox .m{font-size:22px;margin-top:6px;line-height:1.15}
.prox .d{opacity:.85;margin-top:4px}
.fecha{background:var(--primary);color:#fff;padding:10px 14px;margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fecha .n{font-size:18px}
.fecha .dd{font-size:15px;opacity:.85}
.p{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--tint2)}
.p.mio{background:#f4f4f8;box-shadow:inset 4px 0 0 var(--secondary)}
.eq{font-size:16px;line-height:1.15}
.eq.l{text-align:right}
.esc{width:24px;height:24px;object-fit:contain;vertical-align:middle;flex:none}
.eq{display:flex;align-items:center;gap:8px}
.eq.l{justify-content:flex-end}
table.pos .tmw{display:flex;align-items:center;gap:10px}
.esc-ph{width:24px;height:24px;flex:none}
.eq b{font-weight:700}
.sig{display:none}
.res{min-width:78px;text-align:center}
.res .s{font-family:'Saira',sans-serif;font-stretch:125%;font-style:italic;font-weight:700;font-size:20px;color:var(--secondary)}
.res .h{font-size:14px;color:var(--t2);border:1px solid var(--line);padding:3px 8px;display:inline-block}
.w{font-weight:700}
.info{grid-column:1/-1;text-align:center;font-size:13px;color:var(--t2);margin-top:-4px}
.empty{padding:40px 10px;text-align:center;color:var(--t2)}
.seg{display:flex;border:2px solid var(--secondary);margin:6px 0 4px;max-width:360px}
.seg button{flex:1;background:#fff;color:var(--secondary);border:none;font:inherit;font-size:17px;padding:9px;cursor:pointer}
.seg button.on{background:var(--secondary);color:#fff}
table.pos{width:100%;border-collapse:collapse;margin-top:12px;font-size:16px}
table.pos th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);text-align:right;padding:8px 6px;border-bottom:2px solid var(--primary)}
table.pos th:nth-child(2){text-align:left}
table.pos td{padding:10px 6px;border-bottom:1px solid var(--tint2);text-align:right}
table.pos td:nth-child(2){text-align:left}
table.pos td.n{font-family:'Saira',sans-serif;font-stretch:125%;font-style:italic;font-weight:700;color:var(--secondary);text-align:center;width:34px}
table.pos td.pts{font-family:'Saira',sans-serif;font-stretch:125%;font-style:italic;font-weight:700;font-size:19px;color:var(--secondary)}
table.pos tr.mio td{background:#f4f4f8}
table.pos tr.mio td:first-child{box-shadow:inset 4px 0 0 var(--secondary)}
.gtit{margin-top:18px;font-size:20px}
.fuente{font-size:13px;color:var(--t2);margin-top:14px}
@media(max-width:560px){ table.pos .xs{display:none} }
footer{background:var(--gradient);color:#fff;text-align:center;padding:22px 16px;font-size:14px}
footer img{height:26px;display:block;margin:0 auto 8px}
.share{margin-left:auto}
@media(max-width:560px){h1{font-size:28px}.eq .nom{display:none}.sig{display:inline}.eq{font-size:17px}}
</style>
</head>

var B = null, F = null, S = {comp: '', cat: '', fase: '', vista: 'pos', club: '', anio: 0, torneo: '', div: ''};
var q = new URLSearchParams(location.search);
function lsG(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsS(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
function ssG(k){ try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; } }
function ssS(k,v){ try { sessionStorage.setItem(k, v); } catch(e){} }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pd(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function hoy(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function $(id){ return document.getElementById(id); }
function chips(id, vals, cur, fn, labels){
  var e = $(id); e.innerHTML = '';
  if (vals.length < 2) { e.style.display = 'none'; return; } e.style.display = '';
  vals.forEach(function(v, i){ var b = document.createElement('button'); b.className = 'chip' + (v === cur ? ' on' : ''); b.textContent = labels ? labels[i] : v; b.onclick = function(){ fn(v); }; e.appendChild(b); });
}
// ── Uso (anónimo): suma 1 a contadores; nada más ──
function clave(s){ return String(s).replace(/[.#$\/\[\]]/g, '').replace(/\s+/g, ' ').trim().slice(0, 60); }
function sumar(path){
  var u = DB + '/stats/dias/' + hoy() + '/' + path + '.json';
  fetch(u).then(function(r){ return r.json(); }).then(function(v){
    return fetch(u, {method: 'PUT', body: JSON.stringify((typeof v === 'number' ? v : 0) + 1)});
  }).catch(function(){});
}
function contarUnaVez(k, path, porDia){
  var kk = 'pub_' + k + (porDia ? '_' + hoy() : '');
  if ((porDia ? lsG(kk) : ssG(kk))) return;
  if (porDia) lsS(kk, '1'); else ssS(kk, '1');
  sumar(path);
}
// ── Competencias a partir de la BDUAR: TRL, TRL B, URR ──
function faseCorta(n){ n = n.toUpperCase(); if (/COPA ORO/.test(n)) return 'Copa Oro'; if (/COPA PLATA/.test(n)) return 'Copa Plata'; if (/CUARTOS/.test(n)) return 'Cuartos'; if (/SEMI/.test(n)) return 'Semifinal'; if (/FINAL/.test(n)) return 'Final'; return 'Fase regular'; }
var ORDEN_CAT = ['Primera', 'Reserva', 'Pre Reserva', 'Pre Reserva B'], ORDEN_FASE = ['Fase regular', 'Copa Oro', 'Copa Plata', 'Cuartos', 'Semifinal', 'Final'];
function competencias(){
  var C = {};
  function get(comp, cat, fase){ var key = comp + '|' + cat + '|' + fase; return C[key] || (C[key] = {comp: comp, cat: cat, fase: fase, tablas: [], partidos: []}); }
  function compDe(t, g){ return t.nombre === 'TRL' && g === 'B' ? 'TRL B' : t.nombre; }
  (B.torneos || []).forEach(function(t){
    (t.tablas || []).forEach(function(x){ get(compDe(t, x.grupo), x.categoria, x.fase).tablas.push(x.tabla); });
    (t.partidos || []).forEach(function(p){ get(compDe(t, p.grupo), p.categoria, p.fase).partidos.push(p); });
  });
  return Object.keys(C).map(function(k){ return C[k]; }).filter(function(x){ return x.tablas.length || x.partidos.length; });
}
function ordenar(arr, orden){ return arr.sort(function(a, b){ var ia = orden.indexOf(a), ib = orden.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); }); }
function uniq(a){ return a.filter(function(v, i){ return a.indexOf(v) === i; }); }
function renderB(){
  var CS = competencias();
  var comps = ordenar(uniq(CS.map(function(c){ return c.comp; })), ['TRL', 'TRL B', 'URR']);
  if (comps.indexOf(S.comp) < 0) S.comp = comps[0];
  $('anios').style.display = 'none';
  chips('torneos', comps, S.comp, function(v){ S.comp = v; S.cat = ''; S.fase = ''; renderB(); });
  var cats = ordenar(uniq(CS.filter(function(c){ return c.comp === S.comp; }).map(function(c){ return c.cat; })), ORDEN_CAT);
  if (cats.indexOf(S.cat) < 0) S.cat = cats[0];
  chips('divs', cats, S.cat, function(v){ S.cat = v; S.fase = ''; renderB(); });
  var fases = ordenar(uniq(CS.filter(function(c){ return c.comp === S.comp && c.cat === S.cat; }).map(function(c){ return c.fase; })), ORDEN_FASE);
  if (fases.indexOf(S.fase) < 0) S.fase = fases[0];
  chips('fases', fases, S.fase, function(v){ S.fase = v; renderB(); });
  var X = CS.find(function(c){ return c.comp === S.comp && c.cat === S.cat && c.fase === S.fase; }) || {tablas: [], partidos: []};
  if (!X.tablas.length && S.vista === 'pos') S.vista = 'fix';
  $('vista').style.display = X.tablas.length ? '' : 'none';
  [...$('vista').children].forEach(function(b){ b.classList.toggle('on', b.dataset.v === S.vista); });
  $('tit').textContent = S.comp + ' · ' + S.cat + (S.fase !== 'Fase regular' ? ' · ' + S.fase : '');
  // Mi club: equipos de la competencia
  var eqs = {}; X.tablas.forEach(function(t){ t.forEach(function(r){ eqs[r.eq] = 1; }); }); X.partidos.forEach(function(p){ eqs[p.loc] = 1; eqs[p.vis] = 1; });
  CS.filter(function(c){ return c.comp === S.comp; }).forEach(function(c){ c.tablas.forEach(function(t){ t.forEach(function(r){ eqs[r.eq] = 1; }); }); });
  $('club').innerHTML = '<option value="">Todos los clubes</option>' + Object.keys(eqs).sort().map(function(n){ return '<option' + (n === S.club ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
  contarUnaVez('v_' + S.comp + S.cat + S.fase, 'vistas/' + clave(S.comp + ' ' + S.cat + (S.fase !== 'Fase regular' ? ' ' + S.fase : '')), false);
  // próximo partido
  var ps = X.partidos.slice().sort(function(a, b){ return a.f < b.f ? -1 : a.f > b.f ? 1 : (a.hora || '').localeCompare(b.hora || ''); });
  var club = eqs[S.club] ? S.club : '';   // si mi club no juega esta competencia, se ve todo
  var todosCat = []; CS.filter(function(c){ return c.comp === S.comp && c.cat === S.cat; }).forEach(function(c){ todosCat = todosCat.concat(c.partidos); });
  todosCat.sort(function(a, b){ return a.f < b.f ? -1 : a.f > b.f ? 1 : (a.hora || '').localeCompare(b.hora || ''); });
  var h = hoy(), mios = club ? ps.filter(function(p){ return p.loc === club || p.vis === club; }) : ps;
  var sig = (club ? todosCat.filter(function(p){ return p.loc === club || p.vis === club; }) : todosCat).find(function(p){ return p.f >= h && (p.pL == null || p.pV == null); });
  $('prox').innerHTML = sig ? '<div class="prox"><div class="k">' + (club ? 'Próximo partido de ' + esc(club) : 'Próxima fecha') + '</div><div class="m disp">' + esc(club ? sig.loc + ' vs ' + sig.vis : (sig.fn ? 'Fecha ' + sig.fn : (sig.fase || 'Próximo partido'))) + '</div><div class="d">' + pd(sig.f).toLocaleDateString('es-AR', {weekday: 'long', day: 'numeric', month: 'long'}) + (sig.hora ? ' · ' + sig.hora + ' h' : '') + '</div></div>' : '';
  if (S.vista === 'pos') {
    $('lista').innerHTML = X.tablas.map(function(t, i){
      return (X.tablas.length > 1 ? '<div class="gtit disp">Grupo ' + (i + 1) + '</div>' : '') +
        '<table class="pos"><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th class="xs">PG</th><th class="xs">PE</th><th class="xs">PP</th><th class="xs">Dif</th><th class="xs">Bon</th><th>Pts</th></tr></thead><tbody>' +
        t.map(function(r, k){ return '<tr' + (r.eq === club ? ' class="mio"' : '') + '><td class="n">' + (k + 1) + '</td><td><div class="tmw">' + escN(r.eq) + '<span>' + esc(r.eq) + '</span></div></td><td>' + (r.pj == null ? '' : r.pj) + '</td><td class="xs">' + (r.pg == null ? '' : r.pg) + '</td><td class="xs">' + (r.pe == null ? '' : r.pe) + '</td><td class="xs">' + (r.pp == null ? '' : r.pp) + '</td><td class="xs">' + (r.dif == null ? '' : (r.dif > 0 ? '+' : '') + r.dif) + '</td><td class="xs">' + (r.bon || 0) + '</td><td class="pts">' + (r.pts == null ? '' : r.pts) + '</td></tr>'; }).join('') + '</tbody></table>';
    }).join('');
  } else {
    var lista = club ? mios : ps, html = '', last = '';
    lista.forEach(function(p){
      var k = p.f + '|' + p.fn;
      if (k !== last) { last = k; html += '<div class="fecha"><span class="n disp">' + (p.fn ? 'Fecha ' + p.fn : esc(S.fase)) + '</span><span class="dd">' + (p.f ? pd(p.f).toLocaleDateString('es-AR', {weekday: 'long', day: 'numeric', month: 'long'}) : '') + '</span></div>'; }
      var j = p.pL != null && p.pV != null, gl = j && p.pL > p.pV, gv = j && p.pV > p.pL, mio = club && (p.loc === club || p.vis === club);
      html += '<div class="p' + (mio ? ' mio' : '') + '"><div class="eq l' + (gl ? ' w' : '') + '"><span>' + esc(p.loc) + '</span>' + escN(p.loc) + '</div><div class="res">' + (j ? '<span class="s">' + p.pL + ' – ' + p.pV + '</span>' : '<span class="h">' + esc(p.hora || 'vs') + '</span>') + '</div><div class="eq' + (gv ? ' w' : '') + '">' + escN(p.vis) + '<span>' + esc(p.vis) + '</span></div></div>';
    });
    $('lista').innerHTML = html || '<div class="empty">Sin partidos.</div>';
  }
  $('fuente').textContent = 'Datos: Unión Argentina de Rugby / Unión de Rugby de Rosario.';
  var u = new URL(location.href); u.search = '';
  u.searchParams.set('c', S.comp); u.searchParams.set('cat', S.cat); if (S.fase !== 'Fase regular') u.searchParams.set('fase', S.fase); u.searchParams.set('v', S.vista); if (S.club) u.searchParams.set('club', S.club);
  history.replaceState(null, '', u.toString());
}
// ── Respaldo: fixture cargado en la app (si todavía no hay datos de la BDUAR) ──
function renderF(){
  var D = F; $('vista').style.display = 'none'; $('fases').style.display = 'none';
  var anios = uniq(D.divisiones.map(function(d){ return d.anio; })).sort();
  if (anios.indexOf(S.anio) < 0) S.anio = anios.indexOf(new Date().getFullYear()) >= 0 ? new Date().getFullYear() : anios[anios.length - 1];
  chips('anios', anios, S.anio, function(v){ S.anio = v; S.torneo = ''; S.div = ''; renderF(); });
  var tors = uniq(D.divisiones.filter(function(d){ return d.anio === S.anio; }).map(function(d){ return d.torneo || 'Torneo'; }));
  if (tors.indexOf(S.torneo) < 0) S.torneo = tors[0] || '';
  chips('torneos', tors, S.torneo, function(v){ S.torneo = v; S.div = ''; renderF(); });
  var dv = D.divisiones.filter(function(d){ return d.anio === S.anio && (d.torneo || 'Torneo') === S.torneo; }), noms = dv.map(function(d){ return d.nombre; });
  if (noms.indexOf(S.div) < 0) S.div = noms[0] || '';
  chips('divs', noms, S.div, function(v){ S.div = v; renderF(); });
  var div = dv.find(function(d){ return d.nombre === S.div; });
  $('tit').textContent = 'Fixture ' + [S.torneo, S.div, S.anio].filter(Boolean).join(' ');
  var eqs = {}; dv.forEach(function(d){ d.partidos.forEach(function(p){ [p.loc, p.vis].forEach(function(n){ if (!/zona|grupo|ganador|perdedor|clasific/i.test(n)) eqs[n] = 1; }); }); });
  $('club').innerHTML = '<option value="">Todos los clubes</option>' + Object.keys(eqs).sort().map(function(n){ return '<option' + (n === S.club ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
  if (!div) { $('lista').innerHTML = '<div class="empty">Todavía no hay fixture cargado.</div>'; $('prox').innerHTML = ''; return; }
  var ps = div.partidos.slice().sort(function(a, b){ return a.f < b.f ? -1 : a.f > b.f ? 1 : (a.hora || '').localeCompare(b.hora || ''); });
  if (S.club) ps = ps.filter(function(p){ return p.loc === S.club || p.vis === S.club; });
  var h = hoy(), sig = ps.find(function(p){ return p.f >= h && (p.pL == null || p.pV == null); });
  $('prox').innerHTML = sig ? '<div class="prox"><div class="k">' + (S.club ? 'Próximo partido de ' + esc(S.club) : 'Próxima fecha') + '</div><div class="m disp">' + esc(S.club ? sig.loc + ' vs ' + sig.vis : 'Fecha ' + (sig.fn || '')) + '</div><div class="d">' + pd(sig.f).toLocaleDateString('es-AR', {weekday: 'long', day: 'numeric', month: 'long'}) + '</div></div>' : '';
  var html = '', last = '';
  ps.forEach(function(p){
    var k = p.f + '|' + p.fn;
    if (k !== last) { last = k; html += '<div class="fecha"><span class="n disp">' + (p.fn ? 'Fecha ' + p.fn : 'Partido') + '</span><span class="dd">' + pd(p.f).toLocaleDateString('es-AR', {weekday: 'long', day: 'numeric', month: 'long'}) + '</span></div>'; }
    var j = p.pL != null && p.pV != null, gl = j && p.pL > p.pV, gv = j && p.pV > p.pL, mio = S.club && (p.loc === S.club || p.vis === S.club);
    html += '<div class="p' + (mio ? ' mio' : '') + '"><div class="eq l' + (gl ? ' w' : '') + '"><span>' + esc(p.loc) + '</span>' + escN(p.loc) + '</div><div class="res">' + (j ? '<span class="s">' + p.pL + ' – ' + p.pV + '</span>' : '<span class="h">' + esc(p.hora || 'vs') + '</span>') + '</div><div class="eq' + (gv ? ' w' : '') + '">' + escN(p.vis) + '<span>' + esc(p.vis) + '</span></div></div>';
  });
  $('lista').innerHTML = html || '<div class="empty">Sin partidos.</div>';
}
function render(){ if (B) renderB(); else if (F) renderF(); }
$('club').onchange = function(){ S.club = this.value; lsS('pub_club', S.club); if (S.club) contarUnaVez('c_' + S.club, 'clubes/' + clave(S.club), true); render(); };
[...$('vista').children].forEach(function(b){ b.onclick = function(){ S.vista = b.dataset.v; render(); }; });
$('share').onclick = function(){
  var t = $('tit').textContent + ' · Dinastia';
  if (navigator.share) navigator.share({title: t, url: location.href}).catch(function(){});
  else { try { navigator.clipboard.writeText(location.href); this.textContent = '¡Link copiado!'; } catch(e){ prompt('Copiá el link', location.href); } }
};
S.comp = q.get('c') || ''; S.cat = q.get('cat') || ''; S.fase = q.get('fase') || ''; S.vista = q.get('v') || 'pos'; S.club = q.get('club') || lsG('pub_club');
contarUnaVez('visita', 'visitas', true);
if (S.club) contarUnaVez('c_' + S.club, 'clubes/' + clave(S.club), true);
Promise.all([
  fetch(DB + '/publico/bduar.json').then(function(r){ return r.json(); }).catch(function(){ return null; }),
  fetch(DB + '/publico/fixture.json').then(function(r){ return r.json(); }).catch(function(){ return null; })
]).then(function(r){
  B = r[0] && r[0].torneos ? r[0] : null; F = r[1] && r[1].divisiones ? r[1] : null;
  var act = (B && B.generado) || (F && F.actualizado);
  if (act) $('act').textContent = 'Actualizado ' + new Date(act).toLocaleDateString('es-AR', {day: 'numeric', month: 'long'});
  if (!B && !F) { $('lista').innerHTML = '<div class="empty">No se pudo cargar el fixture. Probá de nuevo en un rato.</div>'; return; }
  render();
});
